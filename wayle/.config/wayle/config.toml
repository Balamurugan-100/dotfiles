# ====================================================================
# Wayle Desktop Shell Configuration
# Minimal, full-width, macOS-style topbar with toggle capability
# ====================================================================

[general]
font-sans = "JetBrainsMono Nerd Font"
font-mono = "JetBrainsMono Nerd Font Mono"
tearing-mode = false

[bar]
scale = 0.85
inset-edge = 0.0
inset-ends = 0.0
padding = 0.2
padding-ends = 0.4
module-gap = 0.3
location = "top"
exclusive = true
layer = "top"
bg = "bg-surface"
background-opacity = 88
border-location = "bottom"
border-width = 1
border-color = "border-default"
rounding = "none"
shadow = "none"

button-variant = "basic"
button-opacity = 100
button-bg-opacity = 100
button-icon-size = 0.85
button-icon-padding = 0.4
button-label-size = 0.85
button-label-weight = "medium"
button-label-padding = 0.4
button-rounding = "sm"
button-gap = 0.4
button-icon-position = "start"
button-border-location = "none"
button-border-width = 1

button-group-border-location = "none"
button-group-border-width = 1
button-group-padding = 0.0
button-group-module-gap = 0.2
button-group-background = "bg-elevated"
button-group-opacity = 90
button-group-border-color = "border-accent"
button-group-rounding = "sm"

dropdown-shadow = true
dropdown-opacity = 95
dropdown-autohide = true
dropdown-freeze-label = true

[[bar.layout]]
monitor = "*"
show = true
left = ["niri-workspaces", "hyprland-workspaces", "window-title"]
center = ["clock"]
right = [
    "volume",
    "brightness",
    "network",
    "bluetooth",
    "battery",
    "power",
]

[styling]
scale = 0.85
rounding = "sm"
theme-provider = "wayle"
theming-monitor = ""

[styling.palette]
bg = "#1e1e2e"
surface = "#181825"
elevated = "#313244"
fg = "#cdd6f4"
fg-muted = "#a6adc8"
primary = "#cba6f7"
red = "#f38ba8"
yellow = "#f9e2af"
green = "#a6e3a1"
blue = "#89b4fa"

# ── Modules ───────────────────────────────────────────────────────
[modules.hyprland-workspaces]
min-workspace-count = 5
monitor-specific = false
show-special = false
urgent-show = true
display-mode = "label"
numbering = "absolute"
active-indicator = "background"
active-color = "accent"
occupied-color = "fg-default"
empty-color = "fg-muted"
container-bg-color = "bg-surface"
border-show = true

[modules.window-title]
show-icon = false
max-length = 30

[modules.clock]
format = "%a %b %d  %H:%M"

[modules.volume]
icon-muted = "ld-volume-x-symbolic"
icon-low = "ld-volume-symbolic"
icon-medium = "ld-volume-1-symbolic"
icon-high = "ld-volume-2-symbolic"

[modules.brightness]
icon-low = "ld-sun-dim-symbolic"
icon-medium = "ld-sun-medium-symbolic"
icon-high = "ld-sun-symbolic"

[modules.network]
show-ip = false

[modules.battery]

[modules.power]
icon = "ld-power-symbolic"

[osd]
enabled = true
position = "bottom"
duration = 1800
margin = 60.0
border = true
layer = "overlay"

[wallpaper]
engine-enabled = false
cycling-enabled = false
