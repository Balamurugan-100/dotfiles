"$schema" = "https://raw.githubusercontent.com/JanDeDobbeleer/oh-my-posh/main/themes/schema.json"

version = 4
final_space = true

[[blocks]]
type = "prompt"
alignment = "left"

[[blocks.segments]]
type = "text"
style = "plain"
foreground = "#98C379"
foreground_templates = ["{{ if gt .Code 0 }}#E06C75{{ end }}"]
template = "➜"

[[blocks.segments]]
type = "path"
style = "plain"
foreground = "#56B6C2"
template = "  {{ .Path }}"

[blocks.segments.options]
style = "folder"

[[blocks.segments]]
type = "git"
style = "plain"
foreground = "#D0666F"
template = ' <#5FAAE8>git:(</>{{ .HEAD }}{{ if .Working.Changed }} <#FFEB3B>{{ .Working.String }}</>{{ end }}<#5FAAE8>)</>{{ if or .Working.Changed .Staging.Changed }} <#FFEB3B>✗</>{{ end }}'

[blocks.segments.options]
branch_icon = ""
