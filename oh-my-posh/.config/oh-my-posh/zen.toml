"$schema" = "https://raw.githubusercontent.com/JanDeDobbeleer/oh-my-posh/main/themes/schema.json"
version = 4
final_space = true

# Catppuccin Mocha — developer HUD

# ── MAIN PROMPT ────────────────────────────────────────────

[[blocks]]
type = "prompt"
alignment = "left"
newline = false

# Identity
[[blocks.segments]]
type = "text"
style = "plain"
foreground = "#cba6f7"
template = " 󰀄 {{ .UserName }} "

[[blocks.segments]]
type = "text"
style = "plain"
foreground = "#45475a"
template = "│ "

# Directory
[[blocks.segments]]
type = "path"
style = "plain"
foreground = "#89b4fa"
template = " {{ .Path }} "

[blocks.segments.options]
style = "folder"
max_depth = 3

# Git
[[blocks.segments]]
type = "git"
style = "plain"
foreground = "#b4befe"
template = " {{ .HEAD }}{{ if .Working.Changed }} <#f9e2af>●</>{{ end }}{{ if .Staging.Changed }} <#a6e3a1>✓</>{{ end }}{{ if .Behind }} <#f38ba8>↓{{ .Behind }}</>{{ end }}{{ if .Ahead }} <#a6e3a1>↑{{ .Ahead }}</>{{ end }} "

[blocks.segments.options]
branch_icon = ""
fetch_status = true

# ── LANGUAGE / ENVIRONMENT INDICATORS ─────────────────────

# Python + active virtualenv
[[blocks.segments]]
type = "python"
style = "plain"
foreground = "#f9e2af"
template = " {{ if .Venv }}{{ .Venv }} {{ end }}{{ .Full }} "

[blocks.segments.options]
display_mode = "environment"
fetch_virtual_env = true
display_default = false

# Go
[[blocks.segments]]
type = "go"
style = "plain"
foreground = "#74c7ec"
template = " {{ .Full }} "

[blocks.segments.options]
display_mode = "context"

# Rust
[[blocks.segments]]
type = "rust"
style = "plain"
foreground = "#fab387"
template = " {{ .Full }} "

[blocks.segments.options]
display_mode = "context"

# Node.js + package manager
[[blocks.segments]]
type = "node"
style = "plain"
foreground = "#a6e3a1"
template = " {{ .Full }}{{ if .PackageManagerIcon }} {{ .PackageManagerIcon }}{{ end }} "

[blocks.segments.options]
display_mode = "context"
fetch_package_manager = true

# Bun
[[blocks.segments]]
type = "bun"
style = "plain"
foreground = "#f9e2af"
template = " {{ .Full }} "

[blocks.segments.options]
display_mode = "context"

# ── RIGHT SIDE ────────────────────────────────────────────

[[blocks]]
type = "rprompt"
alignment = "right"

# Execution time for previous command
[[blocks.segments]]
type = "executiontime"
style = "plain"
foreground = "#fab387"
template = "◷ {{ .FormattedMs }} "

[blocks.segments.options]
threshold = 2000

# Exit status code on failure
[[blocks.segments]]
type = "status"
style = "plain"
foreground = "#f38ba8"
template = "{{ if ne .Code 0 }}✘ {{ .Code }} {{ end }}"

[blocks.segments.options]
always_enabled = true

# ── COMMAND LINE ──────────────────────────────────────────

[[blocks]]
type = "prompt"
alignment = "left"
newline = true

[[blocks.segments]]
type = "text"
style = "plain"
foreground = "#cba6f7"
template = "╰─ ❯ "
