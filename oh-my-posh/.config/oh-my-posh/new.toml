"$schema" = "https://raw.githubusercontent.com/JanDeDobbeleer/oh-my-posh/main/themes/schema.json"
final_space = true
version = 4

[[blocks]]
alignment = "right"
type = "prompt"

[[blocks.segments]]
background = "#29315A"
foreground = "#E64747"
leading_diamond = ""
style = "diamond"
template = "{{ .UserName }}"
trailing_diamond = " "
type = "session"

[[blocks.segments]]
background = "#29315A"
foreground = "#3EC669"
leading_diamond = ""
style = "diamond"
template = " {{ .Path }}"
trailing_diamond = ""
type = "path"

[blocks.segments.options]
style = "folder"

[[blocks.segments]]
background = "#29315A"
foreground = "#43CCEA"
leading_diamond = " "
style = "diamond"
template = "{{ .HEAD }}"
trailing_diamond = ""
type = "git"

[blocks.segments.options]
branch_icon = ""

[[blocks.segments]]
background = "#29315A"
foreground = "#E4F34A"
leading_diamond = " "
style = "diamond"
template = "{{ if .Error }}{{ .Error }}{{ else }}{{ if .Venv }}{{ .Venv }} {{ end }}{{ .Full }}{{ end }}"
trailing_diamond = ""
type = "python"

[[blocks.segments]]
background = "#29315A"
foreground = "#7FD5EA"
leading_diamond = " "
style = "diamond"
template = "{{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }}"
trailing_diamond = ""
type = "go"

[[blocks.segments]]
background = "#29315A"
foreground = "#42E66C"
leading_diamond = " "
style = "diamond"
template = "{{ if .PackageManagerIcon }}{{ .PackageManagerIcon }} {{ end }}{{ .Full }}"
trailing_diamond = ""
type = "node"

[[blocks.segments]]
background = "#29315A"
foreground = "#E64747"
leading_diamond = " "
style = "diamond"
template = "{{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }}"
trailing_diamond = ""
type = "ruby"

[[blocks.segments]]
background = "#29315A"
foreground = "#E64747"
leading_diamond = " "
style = "diamond"
template = "{{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }}"
trailing_diamond = ""
type = "java"

[[blocks.segments]]
background = "#29315A"
foreground = "#9B6BDF"
leading_diamond = " "
style = "diamond"
template = "{{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} "
trailing_diamond = ""
type = "julia"

[[blocks.segments]]
background = "#29315A"
foreground = "#9B6BDF"
foreground_templates = [ "{{if eq \"Charging\" .State.String}}#40c4ff{{end}}", "{{if eq \"Discharging\" .State.String}}#ff5722{{end}}", "{{if eq \"Full\" .State.String}}#4caf50{{end}}" ]
leading_diamond = " "
style = "diamond"
template = "{{ if not .Error }}{{ .Icon }}{{ .Percentage }}{{ end }}{{ .Error }}"
trailing_diamond = ""
type = "battery"

[blocks.segments.options]
charged_icon = " "
charging_icon = "⇡ "
discharging_icon = "⇣ "

[[blocks]]
alignment = "left"
newline = true
type = "prompt"

[[blocks.segments]]
background = "#29315A"
foreground = "#AEA4BF"
leading_diamond = ""
style = "diamond"
template = "{{ .FormattedMs }}"
trailing_diamond = " "
type = "executiontime"

[blocks.segments.options]
style = "austin"
threshold = 150

[[blocks.segments]]
background = "#29315A"
foreground = "#7FD5EA"
leading_diamond = ""
style = "diamond"
template = "❯"
trailing_diamond = ""
type = "text"
