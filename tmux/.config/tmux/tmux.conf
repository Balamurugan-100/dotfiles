##### PREFIX

unbind C-b
unbind C-p
set -g prefix C-s
bind C-s send-prefix
set -g repeat-time 300

##### GENERAL

set -g mouse on
set -g extended-keys on
set -g extended-keys-format csi-u
set -g set-clipboard on
set -g status-position top
set -g base-index 1
set -g pane-base-index 1
setw -g mode-keys vi

##### COPY MODE

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

##### WINDOW AND PANE MANAGEMENT

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind r command-prompt "rename-window %%"
bind R command-prompt -I "#S" "rename-session '%%'"
bind-key d detach-client

##### PANE NAVIGATION

bind C-j select-pane -D
bind C-k select-pane -U
bind C-l select-pane -R
bind C-h select-pane -L

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
##### WINDOW NAVIGATION

bind C-p previous-window


bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

##### STYLING

set -g pane-active-border-style 'fg=magenta,bg=default'
set -g pane-border-style 'fg=brightblack,bg=default'

##### FZF URL

set -g @fzf-url-fzf-options '-p 60%,30% --prompt="   " --border-label=" Open URL "'
set -g @fzf-url-history-limit '2000'

##### TPM PLUGINS

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'omerxx/catppuccin-tmux'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'omerxx/tmux-floax'
set -g @plugin 'christoomey/vim-tmux-navigator'

##### FLOAX

set -g @floax-width '80%'
set -g @floax-height '80%'
set -g @floax-border-color 'magenta'
set -g @floax-text-color 'blue'
set -g @floax-bind 'f' 
set -g @floax-change-path 'true'

##### SESSIONX

set -g @sessionx-bind-zo-new-window 'ctrl-y'
set -g @sessionx-auto-accept 'off'
set -g @sessionx-custom-paths '/Users/omerxx/dotfiles'
set -g @sessionx-bind 'o'
set -g @sessionx-x-path '~/dotfiles'
set -g @sessionx-window-height '85%'
set -g @sessionx-window-width '75%'
set -g @sessionx-zoxide-mode 'on'
set -g @sessionx-custom-paths-subdirectories 'false'
set -g @sessionx-filter-current 'false'

##### CATPPUCCIN

set -g @catppuccin_window_left_separator ""
set -g @catppuccin_window_right_separator " "
set -g @catppuccin_window_middle_separator " █"
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text "#{b:window_name}"
set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text "#W#{?window_zoomed_flag,(),}"
set -g @catppuccin_status_modules_right "directory"
set -g @catppuccin_status_modules_left "session"
set -g @catppuccin_status_left_separator " "
set -g @catppuccin_status_right_separator " "
set -g @catppuccin_status_right_separator_inverse "no"
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"
set -g @catppuccin_directory_text "#{b:pane_current_path}"
set -g @catppuccin_meetings_text "#($HOME/.config/tmux/scripts/cal.sh)"
set -g @catppuccin_date_time_text "%H:%M"
set -g @catppuccin_status_modules_right "directory date_time"
set -g @catppuccin_date_time_text "%H:%M"
##### SESH

bind-key t display-popup -w 80% -h 70% -E \
  'sesh list -t --icons | fzf --no-sort --ansi \
    --border-label " sesh " \
    --prompt "⚡  " \
    --header "  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find" \
    --bind "ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)" \
    --bind "ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)" \
    --bind "ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)" \
    --bind "ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)" \
    --bind "ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)" \
    --bind "ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)" \
    --bind "ctrl-n:down,ctrl-p:up,ctrl-j:down,ctrl-k:up,tab:down,btab:up" \
    --cycle \
    --preview-window "right:55%" \
    --preview "sesh preview {}" \
    | xargs -I {} sesh connect "{}"'


##### TPM INIT

run '~/.tmux/plugins/tpm/tpm'
