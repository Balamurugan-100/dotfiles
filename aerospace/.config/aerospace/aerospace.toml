# ==============================================================================
# AeroSpace — Minimal Keyboard-Driven Tiling Window Manager for macOS
# Aligned 1:1 with Hyprland workflow; numbered workspaces (1-10) plus
# extra letter workspaces on macOS
# ==============================================================================

config-version = 2

start-at-login = true
auto-reload-config = true
automatically-unhide-macos-hidden-apps = true

# Layout
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'
accordion-padding = 0

# Mouse
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

[gaps]
inner.horizontal = 6
inner.vertical   = 6
outer.left       = 6
outer.bottom     = 6
outer.top        = 6
outer.right      = 6

[mode.main.binding]

# ── Core Applications (Matching Hyprland) ────────────────────────────────────
alt-t     = 'exec-and-forget open -a Kitty'
alt-enter = 'exec-and-forget open -a Kitty'
alt-b     = 'exec-and-forget open -a "Zen Browser" || open -a Firefox'
alt-z     = 'exec-and-forget open -a Zed'
alt-c     = 'exec-and-forget open -a Kitty -n --args nvim'
alt-shift-c = 'exec-and-forget open -a Kitty -n --args opencode'
alt-space = 'exec-and-forget open -g raycast://extensions/raycast/raycast/search'
alt-v     = 'exec-and-forget open -g raycast://extensions/raycast/clipboard-history/clipboard-history'
alt-period = 'exec-and-forget open -g raycast://extensions/raycast/emoji-symbols/search-emoji-symbols'

# ── Window Actions ───────────────────────────────────────────────────────────
alt-q           = 'close'
alt-f           = 'fullscreen'
alt-shift-space = 'layout floating tiling'
alt-shift-r     = 'reload-config'

# ── Workspace Navigation (H/L) ───────────────────────────────────────────────
alt-h = 'workspace --wrap-around prev'
alt-l = 'workspace --wrap-around next'

# ── Focus Window (Vertical Vim Keys) ─────────────────────────────────────────
alt-j = 'focus down'
alt-k = 'focus up'

# ── Move Window to Workspace & Follow (H/L) ──────────────────────────────────
alt-shift-h = 'move-node-to-workspace --focus-follows-window --wrap-around prev'
alt-shift-l = 'move-node-to-workspace --focus-follows-window --wrap-around next'

# ── Move Window (Vertical Vim Keys) ──────────────────────────────────────────
alt-shift-j = 'move down'
alt-shift-k = 'move up'

# ── Workspace Switching (1-10, Pure Numbers) ─────────────────────────────────
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'
alt-0 = 'workspace 10'

# ── Move Node to Workspace & Follow ──────────────────────────────────────────
alt-shift-1 = ['move-node-to-workspace 1', 'workspace 1']
alt-shift-2 = ['move-node-to-workspace 2', 'workspace 2']
alt-shift-3 = ['move-node-to-workspace 3', 'workspace 3']
alt-shift-4 = ['move-node-to-workspace 4', 'workspace 4']
alt-shift-5 = ['move-node-to-workspace 5', 'workspace 5']
alt-shift-6 = ['move-node-to-workspace 6', 'workspace 6']
alt-shift-7 = ['move-node-to-workspace 7', 'workspace 7']
alt-shift-8 = ['move-node-to-workspace 8', 'workspace 8']
alt-shift-9 = ['move-node-to-workspace 9', 'workspace 9']
alt-shift-0 = ['move-node-to-workspace 10', 'workspace 10']

# ── Extra Letter Workspaces ──────────────────────────────────────────────────
# Free letters only (t, b, z, c, v, q, f, h, j, k, l, r are taken by apps/actions)
alt-a = 'workspace A'
alt-d = 'workspace D'
alt-e = 'workspace E'
alt-g = 'workspace G'
alt-i = 'workspace I'
alt-m = 'workspace M'
alt-n = 'workspace N'
alt-o = 'workspace O'
alt-p = 'workspace P'
alt-s = 'workspace S'
alt-u = 'workspace U'
alt-w = 'workspace W'
alt-x = 'workspace X'
alt-y = 'workspace Y'

# ── Move Node to Letter Workspace & Follow ───────────────────────────────────
alt-shift-a = ['move-node-to-workspace A', 'workspace A']
alt-shift-d = ['move-node-to-workspace D', 'workspace D']
alt-shift-e = ['move-node-to-workspace E', 'workspace E']
alt-shift-g = ['move-node-to-workspace G', 'workspace G']
alt-shift-i = ['move-node-to-workspace I', 'workspace I']
alt-shift-m = ['move-node-to-workspace M', 'workspace M']
alt-shift-n = ['move-node-to-workspace N', 'workspace N']
alt-shift-o = ['move-node-to-workspace O', 'workspace O']
alt-shift-p = ['move-node-to-workspace P', 'workspace P']
alt-shift-s = ['move-node-to-workspace S', 'workspace S']
alt-shift-u = ['move-node-to-workspace U', 'workspace U']
alt-shift-w = ['move-node-to-workspace W', 'workspace W']
alt-shift-x = ['move-node-to-workspace X', 'workspace X']
alt-shift-y = ['move-node-to-workspace Y', 'workspace Y']

# ── Workspace / Monitor Quick Toggle ─────────────────────────────────────────
alt-tab       = 'workspace-back-and-forth'
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

# ── Service Mode ─────────────────────────────────────────────────────────────
alt-shift-semicolon = 'mode service'

[mode.service.binding]
esc = ['reload-config', 'mode main']
r   = ['flatten-workspace-tree', 'mode main']
f   = ['layout floating tiling', 'mode main']
backspace = ['close-all-windows-but-current', 'mode main']
