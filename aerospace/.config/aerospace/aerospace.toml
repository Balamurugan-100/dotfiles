config-version = 2

# ==============================================================================
# AeroSpace: one window per app, one keystroke per app
#
# Model: every app lives alone in its own workspace, pinned by app-id.
#   alt + <letter>          go to that app (launches it only if it isn't running)
#   alt + shift + <letter>  send the focused window to that app's workspace
#                           and follow it there
# Tiling is effectively off: accordion layout with zero padding means a window
# always fills the screen, and any extra window (popup, sheet) stacks on top.
# ==============================================================================

# ------------------------------------------------------------------------------
# General
# ------------------------------------------------------------------------------
start-at-login = true
auto-reload-config = true
automatically-unhide-macos-hidden-apps = true
accordion-padding = 0
default-root-container-layout = 'accordion'
default-root-container-orientation = 'horizontal'

after-startup-command = []

# Mouse jumps to the centre of the monitor you just focused (multi-monitor)
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# NOTE: persistent-workspaces is intentionally NOT set. Empty workspaces vanish,
# which is what lets alt-h / alt-l cycle through only the apps that are open.

# ------------------------------------------------------------------------------
# Workspace map (letter = mnemonic)
#
#   T  Terminal        Ghostty (Kitty as fallback)
#   W  Web (Zen)       primary browser
#   E  Editor          Zed
#   A  Antigravity     Antigravity app
#   G  Antigravity IDE Antigravity IDE (separate app, own workspace)
#   O  OrbStack        containers / infra
#   C  Claude          Claude desktop
#   X  Codex           OpenAI Codex app
#   N  Notion          notes & specs
#   S  Spotify         music
#   P  Vivaldi         secondary / personal browser
#   I  iOS             Xcode
#
#   1-5  scratch       overflow for anything that isn't pinned above
# ------------------------------------------------------------------------------

[mode.main.binding]

# --- Go to app (focus its workspace; launch only if not already running) ------
# Safe launch: `lsappinfo` checks whether the app is running by bundle ID, and
# `open -b` runs only if it isn't. Pressing the key on an app that's already
# open never re-activates it, so nothing hides itself (the Zen problem).
alt-t = ['workspace T', 'exec-and-forget lsappinfo find bundleid=com.mitchellh.ghostty | grep -q . || open -b com.mitchellh.ghostty']
alt-w = ['workspace W', 'exec-and-forget lsappinfo find bundleid=app.zen-browser.zen | grep -q . || open -b app.zen-browser.zen']
alt-e = ['workspace E', 'exec-and-forget lsappinfo find bundleid=dev.zed.Zed | grep -q . || open -b dev.zed.Zed']
alt-a = ['workspace A', 'exec-and-forget lsappinfo find bundleid=com.google.antigravity | grep -q . || open -b com.google.antigravity']
alt-g = ['workspace G', 'exec-and-forget lsappinfo find bundleid=com.google.antigravity-ide | grep -q . || open -b com.google.antigravity-ide']
alt-o = ['workspace O', 'exec-and-forget lsappinfo find bundleid=dev.kdrag0n.MacVirt | grep -q . || open -b dev.kdrag0n.MacVirt']
alt-c = ['workspace C', 'exec-and-forget lsappinfo find bundleid=com.anthropic.claudefordesktop | grep -q . || open -b com.anthropic.claudefordesktop']
alt-x = ['workspace X', 'exec-and-forget lsappinfo find bundleid=com.openai.codex | grep -q . || open -b com.openai.codex']
alt-n = ['workspace N', 'exec-and-forget lsappinfo find bundleid=notion.id | grep -q . || open -b notion.id']
alt-s = ['workspace S', 'exec-and-forget lsappinfo find bundleid=com.spotify.client | grep -q . || open -b com.spotify.client']
alt-p = ['workspace P', 'exec-and-forget lsappinfo find bundleid=com.vivaldi.Vivaldi | grep -q . || open -b com.vivaldi.Vivaldi']
alt-i = ['workspace I', 'exec-and-forget lsappinfo find bundleid=com.apple.dt.Xcode | grep -q . || open -b com.apple.dt.Xcode']
alt-z = 'workspace Z'

# --- Send focused window to an app's workspace (and follow it) ----------------
alt-shift-t = ['move-node-to-workspace T', 'workspace T']
alt-shift-w = ['move-node-to-workspace W', 'workspace W']
alt-shift-e = ['move-node-to-workspace E', 'workspace E']
alt-shift-a = ['move-node-to-workspace A', 'workspace A']
alt-shift-g = ['move-node-to-workspace G', 'workspace G']
alt-shift-o = ['move-node-to-workspace O', 'workspace O']
alt-shift-c = ['move-node-to-workspace C', 'workspace C']
alt-shift-x = ['move-node-to-workspace X', 'workspace X']
alt-shift-n = ['move-node-to-workspace N', 'workspace N']
alt-shift-s = ['move-node-to-workspace S', 'workspace S']
alt-shift-p = ['move-node-to-workspace V', 'workspace P']
alt-shift-i = ['move-node-to-workspace I', 'workspace I']
alt-shift-d = ['move-node-to-workspace D', 'workspace D']
alt-shift-z = ['move-node-to-workspace Z', 'workspace Z']

# --- Scratch workspaces -------------------------------------------------------
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'

alt-shift-1 = ['move-node-to-workspace 1', 'workspace 1']
alt-shift-2 = ['move-node-to-workspace 2', 'workspace 2']
alt-shift-3 = ['move-node-to-workspace 3', 'workspace 3']
alt-shift-4 = ['move-node-to-workspace 4', 'workspace 4']
alt-shift-5 = ['move-node-to-workspace 5', 'workspace 5']

# --- Switching ----------------------------------------------------------------
alt-tab = 'workspace-back-and-forth'                     # toggle last two apps
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

# --- Cycle through open apps --------------------------------------------------
# No persistent workspaces are defined, so AeroSpace removes empty workspaces
# automatically and prev/next only ever lands on workspaces that have a window.
alt-h = 'workspace --wrap-around prev'
alt-l = 'workspace --wrap-around next'

# --- Windows inside one workspace (popups, second windows, terminal windows) --
alt-shift-h = 'focus --boundaries workspace --boundaries-action wrap-around-the-workspace left'
alt-shift-l = 'focus --boundaries workspace --boundaries-action wrap-around-the-workspace right'

# --- Window actions -----------------------------------------------------------
alt-shift-space = 'layout floating tiling'               # float / unfloat this window
alt-shift-f = 'fullscreen'
alt-shift-q = 'close'

# --- Service mode (rare actions, keeps the main keymap clean) -----------------
alt-shift-semicolon = 'mode service'

[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main']              # reset a messy layout
f = ['layout floating tiling', 'mode main']
backspace = ['close-all-windows-but-current', 'mode main']

# ==============================================================================
# Window detection: pin each app to its workspace
# (find an app-id with: aerospace list-apps)
# ==============================================================================

# T: Terminal
[[on-window-detected]]
if.app-id = 'com.mitchellh.ghostty'
run = 'move-node-to-workspace T'

[[on-window-detected]]
if.app-id = 'net.kovidgoyal.kitty'
run = 'move-node-to-workspace T'

# W: Web (Zen)
[[on-window-detected]]
if.app-id = 'app.zen-browser.zen'
run = 'move-node-to-workspace W'

# E: Zed
[[on-window-detected]]
if.app-id = 'dev.zed.Zed'
run = 'move-node-to-workspace E'

# A: Antigravity
[[on-window-detected]]
if.app-id = 'com.google.antigravity'
run = 'move-node-to-workspace A'

# G: Antigravity IDE
[[on-window-detected]]
if.app-id = 'com.google.antigravity-ide'
run = 'move-node-to-workspace G'

# O: OrbStack
[[on-window-detected]]
if.app-id = 'dev.kdrag0n.MacVirt'
run = 'move-node-to-workspace O'

# C: Claude
[[on-window-detected]]
if.app-id = 'com.anthropic.claudefordesktop'
run = 'move-node-to-workspace C'

# X: Codex
[[on-window-detected]]
if.app-id = 'com.openai.codex'
run = 'move-node-to-workspace X'

# N: Notion
[[on-window-detected]]
if.app-id = 'notion.id'
run = 'move-node-to-workspace N'

# S: Spotify
[[on-window-detected]]
if.app-id = 'com.spotify.client'
run = 'move-node-to-workspace S'

# P: Vivaldi
[[on-window-detected]]
if.app-id = 'com.vivaldi.Vivaldi'
run = 'move-node-to-workspace P'

# I: Xcode
[[on-window-detected]]
if.app-id = 'com.apple.dt.Xcode'
run = 'move-node-to-workspace I'

# ------------------------------------------------------------------------------
# Dev essentials: these must float, otherwise accordion stretches them to
# fullscreen and you can't see your editor next to the running app.
# ------------------------------------------------------------------------------

# iOS Simulator
[[on-window-detected]]
if.app-id = 'com.apple.iphonesimulator'
run = 'layout floating'

# Android Emulator (runs as a qemu process, so match by name)
[[on-window-detected]]
if.app-name-regex-substring = 'emulator|qemu'
run = 'layout floating'

# Browser Picture-in-Picture (Zen / Vivaldi)
[[on-window-detected]]
if.window-title-regex-substring = 'Picture-in-Picture'
run = 'layout floating'

# ------------------------------------------------------------------------------
# Small utility windows float instead of taking over a workspace
# ------------------------------------------------------------------------------
[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.finder'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.calculator'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.ActivityMonitor'
run = 'layout floating'
