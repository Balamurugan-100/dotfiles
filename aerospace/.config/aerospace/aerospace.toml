 config-version = 2

# ==============================================================================
# AeroSpace — App Launcher + Manual Workspaces
#
# Alt + letter/number         Switch workspace
# Alt + Shift + letter/number Move focused window and follow
# Alt + H / L                 Previous / next workspace
# Alt + Tab                   Previous workspace
# Alt + V                     Raycast Clipboard History
#
# App shortcuts launch an app only when it isn't running.
# No automatic window pinning.
# ==============================================================================

start-at-login = true
auto-reload-config = true
automatically-unhide-macos-hidden-apps = true

accordion-padding = 0
default-root-container-layout = 'accordion'
default-root-container-orientation = 'horizontal'

after-startup-command = []

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

[mode.main.binding]

# ==============================================================================
# App workspaces
# ==============================================================================

# T — Ghostty
alt-t = [
    'workspace T',
    'exec-and-forget /bin/bash -c "lsappinfo find bundleid=com.mitchellh.ghostty | grep -q . || open -b com.mitchellh.ghostty"'
]

# W — Zen
alt-w = [
    'workspace W',
    'exec-and-forget /bin/bash -c "lsappinfo find bundleid=app.zen-browser.zen | grep -q . || open -b app.zen-browser.zen"'
]

# E — Zed
alt-e = [
    'workspace E',
    'exec-and-forget /bin/bash -c "lsappinfo find bundleid=dev.zed.Zed | grep -q . || open -b dev.zed.Zed"'
]

# C — Codex
alt-c = [
    'workspace C',
    'exec-and-forget /bin/bash -c "lsappinfo find bundleid=com.openai.codex | grep -q . || open -b com.openai.codex"'
]

# A — Antigravity 2.0
alt-a = [
    'workspace A',
    'exec-and-forget /bin/bash -c "lsappinfo find bundleid=com.google.antigravity | grep -q . || open -b com.google.antigravity"'
]

# G — Antigravity IDE
alt-g = [
    'workspace G',
    'exec-and-forget /bin/bash -c "lsappinfo find bundleid=com.google.antigravity-ide | grep -q . || open -b com.google.antigravity-ide"'
]

# D — Claude
alt-d = [
    'workspace D',
    'exec-and-forget /bin/bash -c "lsappinfo find bundleid=com.anthropic.claudefordesktop | grep -q . || open -b com.anthropic.claudefordesktop"'
]

# S — Spotify
alt-s = [
    'workspace S',
    'exec-and-forget /bin/bash -c "lsappinfo find bundleid=com.spotify.client | grep -q . || open -b com.spotify.client"'
]

# P — Vivaldi
alt-p = [
    'workspace P',
    'exec-and-forget /bin/bash -c "lsappinfo find bundleid=com.vivaldi.Vivaldi | grep -q . || open -b com.vivaldi.Vivaldi"'
]

# O — OrbStack
alt-o = [
    'workspace O',
    'exec-and-forget /bin/bash -c "lsappinfo find bundleid=dev.kdrag0n.MacVirt | grep -q . || open -b dev.kdrag0n.MacVirt"'
]

# M — WhatsApp
alt-m = [
    'workspace M',
    'exec-and-forget /bin/bash -c "lsappinfo find bundleid=net.whatsapp.WhatsApp | grep -q . || open -b net.whatsapp.WhatsApp"'
]

# ==============================================================================
# Other letter workspaces
# H/L reserved for navigation; V reserved for Raycast
# ==============================================================================

alt-b = 'workspace B'
alt-i = 'workspace I'
alt-j = 'workspace J'
alt-k = 'workspace K'
alt-n = 'workspace N'
alt-q = 'workspace Q'
alt-r = 'workspace R'
alt-u = 'workspace U'
alt-x = 'workspace X'
alt-y = 'workspace Y'
alt-z = 'workspace Z'

# ==============================================================================
# Number workspaces
# ==============================================================================

alt-0 = 'workspace 0'
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'

# ==============================================================================
# Move focused window and follow
# ==============================================================================

alt-shift-a = ['move-node-to-workspace A', 'workspace A']
alt-shift-b = ['move-node-to-workspace B', 'workspace B']
alt-shift-c = ['move-node-to-workspace C', 'workspace C']
alt-shift-d = ['move-node-to-workspace D', 'workspace D']
alt-shift-e = ['move-node-to-workspace E', 'workspace E']
alt-shift-g = ['move-node-to-workspace G', 'workspace G']
alt-shift-i = ['move-node-to-workspace I', 'workspace I']
alt-shift-j = ['move-node-to-workspace J', 'workspace J']
alt-shift-k = ['move-node-to-workspace K', 'workspace K']
alt-shift-m = ['move-node-to-workspace M', 'workspace M']
alt-shift-n = ['move-node-to-workspace N', 'workspace N']
alt-shift-o = ['move-node-to-workspace O', 'workspace O']
alt-shift-p = ['move-node-to-workspace P', 'workspace P']
alt-shift-q = ['move-node-to-workspace Q', 'workspace Q']
alt-shift-r = ['move-node-to-workspace R', 'workspace R']
alt-shift-s = ['move-node-to-workspace S', 'workspace S']
alt-shift-t = ['move-node-to-workspace T', 'workspace T']
alt-shift-u = ['move-node-to-workspace U', 'workspace U']
alt-shift-w = ['move-node-to-workspace W', 'workspace W']
alt-shift-x = ['move-node-to-workspace X', 'workspace X']
alt-shift-y = ['move-node-to-workspace Y', 'workspace Y']
alt-shift-z = ['move-node-to-workspace Z', 'workspace Z']

# Number workspaces
alt-shift-0 = ['move-node-to-workspace 0', 'workspace 0']
alt-shift-1 = ['move-node-to-workspace 1', 'workspace 1']
alt-shift-2 = ['move-node-to-workspace 2', 'workspace 2']
alt-shift-3 = ['move-node-to-workspace 3', 'workspace 3']
alt-shift-4 = ['move-node-to-workspace 4', 'workspace 4']
alt-shift-5 = ['move-node-to-workspace 5', 'workspace 5']
alt-shift-6 = ['move-node-to-workspace 6', 'workspace 6']
alt-shift-7 = ['move-node-to-workspace 7', 'workspace 7']
alt-shift-8 = ['move-node-to-workspace 8', 'workspace 8']
alt-shift-9 = ['move-node-to-workspace 9', 'workspace 9']

# ==============================================================================
# Navigation
# ==============================================================================

alt-h = 'workspace --wrap-around prev'
alt-l = 'workspace --wrap-around next'

alt-tab = 'workspace-back-and-forth'
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

# Navigate windows inside a workspace
alt-shift-h = 'focus --boundaries workspace --boundaries-action wrap-around-the-workspace left'
alt-shift-l = 'focus --boundaries workspace --boundaries-action wrap-around-the-workspace right'

# ==============================================================================
# Window actions
# ==============================================================================

alt-shift-space = 'layout floating tiling'
alt-shift-f = 'fullscreen'

# ==============================================================================
# Service mode
# ==============================================================================

alt-shift-semicolon = 'mode service'

[mode.service.binding]

esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main']
f = ['layout floating tiling', 'mode main']
