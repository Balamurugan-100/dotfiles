# ==============================================================================
# AeroSpace — Minimal Keyboard-Driven Tiling Window Manager for macOS
# Aligned 1:1 with Hyprland workflow & numbered workspaces (1-10)
# ==============================================================================

config-version = 2

start-at-login = true
auto-reload-config = true
automatically-unhide-macos-hidden-apps = true

# Layout
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'
accordion-padding = 0

# Mouse
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

[gaps]
inner.horizontal = 6
inner.vertical   = 6
outer.left       = 6
outer.bottom     = 6
outer.top        = 6
outer.right      = 6

[mode.main.binding]

# ── Core Applications (Matching Hyprland) ────────────────────────────────────
alt-t     = 'exec-and-forget open -a Kitty'
alt-enter = 'exec-and-forget open -a Kitty'
alt-b     = 'exec-and-forget open -a "Zen Browser" || open -a Firefox'
alt-z     = 'exec-and-forget open -a Zed'
alt-c     = 'exec-and-forget open -a Kitty -n --args nvim'
alt-shift-c = 'exec-and-forget open -a Kitty -n --args opencode'
alt-space = 'exec-and-forget open -g raycast://extensions/raycast/raycast/search'
alt-v     = 'exec-and-forget open -g raycast://extensions/raycast/clipboard-history/clipboard-history'
alt-period = 'exec-and-forget open -g raycast://extensions/raycast/emoji-symbols/search-emoji-symbols'

# ── Window Actions ───────────────────────────────────────────────────────────
alt-q           = 'close'
alt-f           = 'fullscreen'
alt-shift-space = 'layout floating tiling'
alt-shift-r     = 'reload-config'

# ── Focus Navigation (Vim Keys) ──────────────────────────────────────────────
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

# ── Move Window (Vim Keys) ───────────────────────────────────────────────────
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# ── Workspace Switching (1-10, Pure Numbers) ─────────────────────────────────
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'
alt-0 = 'workspace 10'

# ── Move Node to Workspace & Follow ──────────────────────────────────────────
alt-shift-1 = ['move-node-to-workspace 1', 'workspace 1']
alt-shift-2 = ['move-node-to-workspace 2', 'workspace 2']
alt-shift-3 = ['move-node-to-workspace 3', 'workspace 3']
alt-shift-4 = ['move-node-to-workspace 4', 'workspace 4']
alt-shift-5 = ['move-node-to-workspace 5', 'workspace 5']
alt-shift-6 = ['move-node-to-workspace 6', 'workspace 6']
alt-shift-7 = ['move-node-to-workspace 7', 'workspace 7']
alt-shift-8 = ['move-node-to-workspace 8', 'workspace 8']
alt-shift-9 = ['move-node-to-workspace 9', 'workspace 9']
alt-shift-0 = ['move-node-to-workspace 10', 'workspace 10']

# ── Workspace / Monitor Quick Toggle ─────────────────────────────────────────
alt-tab       = 'workspace-back-and-forth'
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

# ── Service Mode ─────────────────────────────────────────────────────────────
alt-shift-semicolon = 'mode service'

[mode.service.binding]
esc = ['reload-config', 'mode main']
r   = ['flatten-workspace-tree', 'mode main']
f   = ['layout floating tiling', 'mode main']
backspace = ['close-all-windows-but-current', 'mode main']
