# ====================================================================
# Hyprlock Configuration
# Minimal, modern lockscreen styled with Catppuccin Mocha
# ====================================================================

general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 0
    no_fade_in = false
}

background {
    monitor =
    path = /home/kaizen/.config/hypr/wallpapers/default.jpg
    blur_passes = 3
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# ── Password Input Field ──────────────────────────────────────────
input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    dots_rounding = -1
    outer_color = rgba(203, 166, 247, 0.8) # Mauve
    inner_color = rgba(30, 30, 46, 0.7)    # Base
    font_color = rgb(205, 214, 244)        # Text
    fade_on_empty = false
    placeholder_text = <span foreground="##a6adc8">Password...</span>
    hide_input = false
    rounding = -1
    check_color = rgba(166, 227, 161, 0.8) # Green
    fail_color = rgba(243, 139, 168, 0.8)  # Red
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fail_transition = 300
    position = 0, -60
    halign = center
    valign = center
}

# ── Time Label ────────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgb(205, 214, 244)
    font_size = 75
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, 160
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 3
}

# ── Date Label ────────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %d %B %Y")"
    color = rgb(186, 194, 222)
    font_size = 18
    font_family = JetBrainsMono Nerd Font Medium
    position = 0, 90
    halign = center
    valign = center
}

# ── User Label ────────────────────────────────────────────────────
label {
    monitor =
    text =   $USER
    color = rgb(180, 190, 254)
    font_size = 16
    font_family = JetBrainsMono Nerd Font SemiBold
    position = 0, 10
    halign = center
    valign = center
}
